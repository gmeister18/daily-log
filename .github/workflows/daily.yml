name: Daily log

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append date, commit and push
        run: |
          DATE=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          echo "- $DATE" >> log.md
          git config user.name "gmeister18"
          git config user.email "88345985+gmeister18@users.noreply.github.com"
          git add log.md
          git commit -m "log $DATE"
          git push
